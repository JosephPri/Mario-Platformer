<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Platformer</title>
<style>
  :root { --bg:#f4f4f6; --fg:#222; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1f; --fg:#ddd; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:12px; }
  canvas { max-width:100%; height:auto !important; image-rendering:pixelated; }
  p { margin:0; font-size:14px; text-align:center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <main id="game"></main>
  <p><b>A / D</b> or ← → move &nbsp;·&nbsp; <b>W</b>, ↑ or Space jump &nbsp;·&nbsp; <b>R</b> restart after game over/win</p>
  <script src="game.js"></script>
</body>
</html>
